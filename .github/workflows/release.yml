name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Gradual/Gradual.csproj

      - name: Build Release
        run: dotnet build Gradual/Gradual.csproj --configuration Release --no-restore

      - name: Publish self-contained executable
        run: >
          dotnet publish Gradual/Gradual.csproj
          --configuration Release
          --framework net8.0-windows
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output ./publish

      - name: Copy appsettings.json to publish folder
        run: Copy-Item Gradual/appsettings.json ./publish/appsettings.json
        shell: pwsh

      - name: Zip release
        run: Compress-Archive -Path ./publish/* -DestinationPath ./Gradual-${{ github.ref_name }}-win-x64.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Gradual ${{ github.ref_name }}"
          body: |
            ## Gradual ${{ github.ref_name }}

            ### Installation
            1. Download `Gradual-${{ github.ref_name }}-win-x64.zip`
            2. Extract anywhere
            3. Run `Gradual.exe` — no .NET install required

            ### What's included
            - Self-contained Windows x64 executable
            - GitHub integration, analytics, audit trail, milestone & budget tracking
          files: Gradual-${{ github.ref_name }}-win-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
